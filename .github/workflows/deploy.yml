name: Publicar en Firebase

# Cada cambio en main se compila y se publica en https://crm-falcons.web.app
# (hosting + reglas de Firestore). También se puede lanzar a mano desde
# la pestaña Actions → "Publicar en Firebase" → Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nunca dos publicaciones a la vez: la segunda espera a la primera.
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # La clave de la cuenta de servicio vive como secreto del repositorio
      # (Settings → Secrets and variables → Actions → FIREBASE_SERVICE_ACCOUNT).
      # Sin ella se compila igual pero no se publica, sin marcar error.
      - name: Credenciales de Firebase
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT: se compiló pero no se publicó."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar reglas y hosting
        if: steps.creds.outputs.ok == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: npx --yes firebase-tools@14 deploy --only firestore:rules,hosting --project crm-falcons --non-interactive

      - name: Borrar credenciales
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
